name: Publish images

# Publishes the NGINX base and controller images to
# public.ecr.aws/unionai/ingress-nginx by starting the
# ingress-nginx-images-production-publish pipeline in unionai/cloud for the
# pushed commit. Tags that are already published are skipped there, so only a
# push that changes TAG or images/nginx/TAG builds anything.

on:
  push:
    branches:
      - release-[0-9]+.[0-9]+
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'unionai/ingress-nginx'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger ingress-nginx-images-production-publish
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
        run: .github/scripts/trigger-buildkite-build.sh ingress-nginx-images-production-publish INGRESS_NGINX_REF="${GITHUB_SHA}"
